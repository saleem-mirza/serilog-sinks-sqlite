name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build & Pack
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.artifact-name.outputs.name }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Compute artifact name and version suffix
        id: artifact-name
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          SAFE="${BRANCH//\//-}"
          if [ "$SAFE" = "master" ]; then
            echo "name=nuget-packages" >> $GITHUB_OUTPUT
            echo "suffix=" >> $GITHUB_OUTPUT
          else
            echo "name=nuget-packages-${SAFE}" >> $GITHUB_OUTPUT
            echo "suffix=${SAFE}" >> $GITHUB_OUTPUT
          fi

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Pack
        run: |
          SUFFIX="${{ steps.artifact-name.outputs.suffix }}"
          SUFFIX_ARG=$( [ -n "$SUFFIX" ] && echo "--version-suffix $SUFFIX" || echo "" )
          dotnet pack src/Serilog.Sinks.SQLite/Serilog.Sinks.SQLite.csproj -c Release --no-build -o artifacts $SUFFIX_ARG

      - name: Upload package artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: artifacts/Serilog.*.nupkg
          retention-days: 7

  test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run smoke tests
        run: dotnet run --project samples/SmokeTest -c Release < /dev/null
